name: Feature request
description: Something the integration could do that it does not do yet.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: input
    id: unit
    attributes:
      label: Air conditioner model
      description: Features differ between units; the model helps to tell whether yours reports the capability.
