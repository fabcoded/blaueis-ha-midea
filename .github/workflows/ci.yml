name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Runs exactly the gates contributors get locally, from the same config.
      # The ruff pin now lives in .pre-commit-config.yaml alone — there is no
      # second version to keep in sync. The vendored-mirror gates skip here
      # (no sibling libmidea checkout on a runner), as they do for any
      # contributor working outside the development workspace.
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run hooks
        run: pre-commit run --all-files --show-diff-on-failure

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        # pytest-homeassistant-custom-component pulls a real Home Assistant, which
        # the unit tests need for the platform modules the conftest does not stub
        # (number / sensor / binary_sensor / button). jsonschema / websockets /
        # pyyaml / cryptography mirror manifest.json requirements — HA core does
        # not guarantee them (websockets broke collection when __init__ gained
        # its import).
        run: |
          python -m pip install --upgrade pip
          pip install pytest-homeassistant-custom-component jsonschema \
                      websockets pyyaml cryptography
      - name: Run unit tests
        # The fast half: mocked HA, no event loop. The -m filter keeps this
        # step to the unit suite even if an integration-marked test is ever
        # added under tests/unit.
        run: python -m pytest tests/unit -m "not integration"
      - name: Run integration tests
        # The other half, and a real gate rather than a local-only one: these
        # drive the config flow and the options flow on HA's own flow engine
        # (a real event loop via pytest-homeassistant-custom-component). They
        # are slower than the unit suite but still seconds, so there is no
        # reason to keep them out of the PR gate — an unexercised config flow
        # is exactly the kind of thing that breaks silently on an HA bump.
        # The `integration` marker is applied to the whole directory from
        # tests/integration/conftest.py, so a new file there is gated the
        # moment it lands.
        run: python -m pytest tests/integration -m integration
